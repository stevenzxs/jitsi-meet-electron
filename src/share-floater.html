<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>共享控制</title>
  <link rel="stylesheet" href="share-floater.css" />
</head>
<body>
  <main class="floater" id="floater" aria-label="屏幕共享工具栏">
    <div class="floater__status">
      <span class="floater__grip" title="拖动工具栏" aria-label="拖动工具栏">⠿</span>
      <span class="floater__dot" aria-hidden="true"></span>
      <span id="statusText" aria-live="polite">正在准备共享</span>
      <span id="sourceName" class="floater__source"></span>
      <span id="errorText" class="floater__error" role="alert"></span>
      <span class="floater__hint">移入展开</span>
    </div>
    <nav class="floater__actions" aria-label="共享操作">
      <button id="audioBtn" type="button" disabled>
        <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        <svg class="icon icon--off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V6a3 3 0 0 0-5.94-.6"/><path d="M19 10v2a7 7 0 0 1-11.9 5M5 10v2a7 7 0 0 0 3 5.24"/><path d="M12 19v3"/><path d="M4 4l16 16"/></svg>
        <span class="label">麦克风</span>
      </button>
      <button id="videoBtn" type="button" disabled>
        <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10.5 21 7v10l-6-3.5z"/></svg>
        <svg class="icon icon--off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M10.66 6H13a2 2 0 0 1 2 2v2.34l1 1L21 8v8"/><path d="M15 16v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="M4 4l16 16"/></svg>
        <span class="label">摄像头</span>
      </button>
      <button id="recordingBtn" type="button" aria-pressed="false" disabled hidden>
        <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
        <svg class="icon icon--off icon--fill" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        <span class="label">录屏</span>
      </button>
      <button id="participantsBtn" type="button" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.6 14.3c2.9.5 5.4 2.7 5.4 5.7"/></svg>
        <span class="label">成员</span>
      </button>
      <span class="floater__separator" aria-hidden="true"></span>
      <button id="switchBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M12 8v5M9.5 10.5 12 8l2.5 2.5"/></svg>
        <span class="label">新的共享</span>
      </button>
      <button id="pauseBtn" type="button">
        <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        <svg class="icon icon--off icon--fill" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 4.5v15l13-7.5z"/></svg>
        <span class="label">暂停共享</span>
      </button>
      <button id="showMeetingBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v4"/><path d="M10 14 21 3"/><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/></svg>
        <span class="label">返回会议</span>
      </button>
      <button id="stopBtn" class="floater__danger" type="button">
        <svg class="icon icon--fill" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="label">结束共享</span>
      </button>
    </nav>
  </main>
  <script src="share-floater.js"></script>
</body>
</html>
